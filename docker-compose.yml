version: '3.8'

services:
  backend:
    build: ./backend
    container_name: auditor_backend
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      DB_USER: wcag_user
      DB_PASSWORD: wcag_password
      DB_HOST: wcag-postgres
      DB_NAME: wcag_compliance
      DB_PORT: 5432
      FRONTEND_URL: http://localhost:5173
    networks:
      - shared-network
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: auditor_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - shared-network
    restart: unless-stopped

networks:
  shared-network:
    external: true
